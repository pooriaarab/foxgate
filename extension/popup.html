<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>foxgate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>foxgate</h1>
    <section>
      <h2>Agent (simulated)</h2>
      <p>The agent wants to submit the checkout form on checkout.example.com.</p>
      <button id="ask">Ask to submit the form</button>
      <p>Last ask: <output id="asked"></output></p>
      <button id="redeem" disabled>Run the approved action</button>
      <button id="tamper" disabled>Run a changed action (plan: pro)</button>
      <p>Last run: <output id="result"></output></p>
    </section>
    <section>
      <h2>Waiting for you</h2>
      <p id="none">No request waits.</p>
      <ul id="pending"></ul>
    </section>
    <section>
      <h2>Decisions</h2>
      <ol id="log"></ol>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
