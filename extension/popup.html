<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>foxgate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img class="mark" src="icons/icon-48.png" alt="" width="22" height="22" />
      <h1>foxgate</h1>
      <span class="chip">Demo</span>
    </header>
    <section class="card agent">
      <h2>Simulated agent</h2>
      <p class="muted">The agent wants to submit the checkout form on checkout.example.com.</p>
      <button id="ask" class="primary">Ask to submit the form</button>
      <p class="status">Last ask <output id="asked"></output></p>
      <div class="runs">
        <button id="redeem" disabled>Run as approved</button>
        <button id="tamper" disabled>Run with a change</button>
      </div>
      <p class="hint">A change sets the plan to pro. foxgate refuses it.</p>
      <p class="status">Last run <output id="result"></output></p>
    </section>
    <section>
      <h2>Waiting for you</h2>
      <p id="none" class="empty">No request waits.</p>
      <ul id="pending"></ul>
    </section>
    <section>
      <h2>Decisions</h2>
      <ol id="log"></ol>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
